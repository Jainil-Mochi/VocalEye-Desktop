name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore VocalEye.Desktop.slnx
      - run: dotnet format VocalEye.Desktop.slnx --verify-no-changes --no-restore
      - run: dotnet build VocalEye.Desktop.slnx -c Release --no-restore
      - run: dotnet test VocalEye.Desktop.slnx -c Release --no-build
